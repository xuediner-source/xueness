name: xueness

# One-command local deploy. Binds loopback on the HOST by default:
# 127.0.0.1:8137 -> container 8137. Nothing listens on 0.0.0.0 unless
# you explicitly edit the ports mapping AND put auth/TLS in front
# (see README "Public exposure" — not supported silently).
services:
  web:
    build: .
    image: xueness-web:0.1
    container_name: xueness-web
    ports:
      - "127.0.0.1:8137:8137"
    volumes:
      - xueness-data:/data
      # 宿主目录挂载：容器里的文件系统是隔离的，不挂载就只能浏览容器内部。
      # 默认挂一个空的 ./.host-workspace（存在即可用，没有敏感内容），
      # 在浏览器里能对着它建文件夹。
      # 要浏览你 Mac 上的真实项目，把 XUENESS_HOST_WORKSPACE 指向该目录，例如：
      #   XUENESS_HOST_WORKSPACE=/Users/xuediner/code docker compose up -d --build
      # 注意：容器以 appuser(uid 10001) 运行，宿主目录若是 755，可浏览可选取，
      # 但「新建文件夹」需要写权限（否则会如实报 directory-create-failed）。
      - ${XUENESS_HOST_WORKSPACE:-./.host-workspace}:/host-workspace
    environment:
      # Requests use a configured model; sending a task starts a request.
      # Set XUENESS_ALLOW_REAL=0 to disable requests at the host level.
      XUENESS_ALLOW_REAL: "${XUENESS_ALLOW_REAL:-1}"
      # Container network bind is required for Docker port forwarding; the HOST
      # port above remains bound to 127.0.0.1 and cannot be reached remotely.
      XUENESS_ALLOW_REMOTE: "1"
      # 「打开文件夹」的浏览范围（冒号分隔的绝对路径）。既是选择器可见/可建的根，
      # 也是允许用作任务工作区的根 —— 两者共用一份，避免「选得到却建不了任务」。
      # 浏览器壳没有系统文件夹对话框，走的是宿主侧目录浏览（对应 DSH 的 browse 能力）。
      XUENESS_WORKSPACE_ROOTS: "/host-workspace"
      # XUENESS_API_BASE: "https://your-gateway.example/v1"
      # XUENESS_MODEL: "your-model"
      # XUENESS_API_KEY: ""  # never commit a real key; use env_file instead
    command: ["python3", "-m", "xueness.web", "--host", "0.0.0.0", "--port", "8137", "--state", "/data/state", "--web-runs", "/data/web-runs"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if b'\"ok\": true' in urllib.request.urlopen('http://127.0.0.1:8137/api/health', timeout=4).read() else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  xueness-data:
    name: xueness-data
