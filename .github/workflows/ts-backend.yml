name: TypeScript backend
on:
  push:
    paths:
      - 'ts/**'
      - 'webapp/**'
      - 'desktop/src/**'
      - 'desktop/tests/front-door.test.cjs'
      - '.github/workflows/ts-backend.yml'
  pull_request:
    paths:
      - 'ts/**'
      - 'webapp/**'
      - 'desktop/src/**'
      - 'desktop/tests/front-door.test.cjs'
      - '.github/workflows/ts-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: ts check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
      - name: Build the web UI bundle the front door serves
        run: |
          npm ci --prefix webapp --no-audit --no-fund
          npm --prefix webapp run build
      - name: Install the TypeScript workspace
        run: npm ci --prefix ts --no-audit --no-fund
      - name: Line limit, plugin gate, typecheck and tests
        working-directory: ts
        env:
          XUENESS_ALLOW_REAL: '0'
        run: npm run check
      - name: Desktop backend (TS desktop host)
        run: node --test desktop/tests/front-door.test.cjs
