name: Stage desktop release
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful focused native parity or full extended release test run for this exact commit'
        type: string
        required: true
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      XUENESS_BUILD_RUN: ${{ inputs.build_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
      - name: Install the update-feed parser (js-yaml) without application install scripts
        run: npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
      - name: Verify and upload draft release
        run: node ts/scripts/stage-desktop-release.ts
