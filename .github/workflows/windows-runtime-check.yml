name: Windows runtime regression
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Optional successful Desktop installers run whose Windows package will be rechecked'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  source-runtime:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      XUENESS_ALLOW_REAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
      - name: Exercise PowerShell, terminal and plugin continuity on the TypeScript backend with isolated data
        run: |
          npm ci --prefix ts --no-audit --no-fund
          npm --prefix ts run check
      - name: Recheck the packaged TypeScript backend from a Desktop installers run
        if: inputs.artifact_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          XUENESS_ARTIFACT_RUN: ${{ inputs.artifact_run_id }}
        run: |
          gh run download "$XUENESS_ARTIFACT_RUN" --name Xueness-windows-x64 --dir artifact
          mkdir -p artifact/portable
          unzip -q "$(ls artifact/*.zip | head -n 1)" -d artifact/portable
          npm --prefix ts run test:packaged -- "$(cd artifact/portable && pwd)/resources"
