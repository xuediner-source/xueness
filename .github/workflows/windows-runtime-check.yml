name: Windows runtime regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-runtime:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      XUENESS_ALLOW_REAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Exercise PowerShell and plugin context continuity with isolated data
        run: |
          python -m pip install -r desktop/requirements-build.txt
          python -m tests.windows_console_probe
          python -m unittest tests.test_desktop.DesktopTests.test_source_workflow_worker_completes_powershell_unicode_command tests.test_context_continuity tests.test_agent_work_policy tests.test_terminal_profiles -v
