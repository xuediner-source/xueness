name: Desktop installers
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      fast_build:
        description: 'Run focused ownership, platform parity and package checks; set false for the extended test suite'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: win32
            arch: x64
            target: windows-x64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            target: macos-x64
          - runner: macos-15
            platform: darwin
            arch: arm64
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      XUENESS_ALLOW_REAL: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      XUENESS_BUILD_PLATFORM: ${{ matrix.platform }}
      XUENESS_BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Install build dependencies
        run: |
          python -m pip install -r desktop/requirements-build.txt
          npm ci --prefix webapp --no-audit --no-fund
          npm ci --prefix desktop --no-audit --no-fund
          node desktop/node_modules/electron/install.js
      - name: Check feature ownership and focused native parity
        if: ${{ github.event_name == 'push' || inputs.fast_build != false }}
        run: |
          python tools/check_plugin_architecture.py
          node --test desktop/tests/native-build-guard.test.cjs desktop/tests/native-labels.test.cjs desktop/tests/window-chrome.test.cjs desktop/tests/main-lifecycle.test.cjs desktop/tests/data-directory.test.cjs
          python -m unittest tests.test_plugin_architecture tests.test_host_platform tests.test_host_path_identity -q
          npm --prefix webapp run typecheck
          npm --prefix webapp run build
      - name: Check module entrypoint before the full suite
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fast_build == false }}
        run: python -m unittest tests.test_web_module_startup -q
      - name: Run extended release test suite
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fast_build == false }}
        run: |
          python tools/check_plugin_architecture.py
          node desktop/scripts/check_electron_update_transport.cjs
          python -m unittest discover -s tests -q
          node --test tests/*.test.mjs
          python -m unittest discover -s desktop/tests -p 'test_*.py' -q
          npm --prefix desktop test
          npm --prefix webapp test
          npm --prefix webapp run typecheck
          npm --prefix webapp run build
      - name: Verify public GitHub Windows installer download
        if: runner.os == 'Windows'
        run: node desktop/scripts/check_windows_github_download.cjs
      - name: Freeze the native backend
        run: |
          python desktop/scripts/build_backend.py
      - name: Exercise the actual backend integration suite
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fast_build == false }}
        run: |
          python desktop/scripts/check_backend.py
          python desktop/scripts/check_backend.py --force-exit
      - name: Build Windows installer and portable ZIP
        if: runner.os == 'Windows'
        run: npm --prefix desktop run dist:win -- --x64
      - name: Build native Mac disk image and ZIP
        if: runner.os == 'macOS'
        run: npm --prefix desktop run dist:mac -- --${{ matrix.arch }}
      - name: Verify packaged Electron workbench
        run: python desktop/scripts/check_app.py
      - name: Exercise the installed NSIS in-app update path
        if: ${{ runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.fast_build == false }}
        run: python desktop/scripts/check_windows_update.py
      - name: Upload Windows update smoke diagnostics
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Xueness-Windows-update-smoke-evidence
          path: |
            desktop/update-smoke-evidence/*/*.json
            desktop/update-smoke-evidence/*/*.jsonl
            desktop/update-smoke-evidence/*/*.log
            desktop/update-smoke-evidence/*/*.txt
            desktop/update-smoke-evidence/*/loopback-feed/latest.yml
            desktop/update-smoke-evidence/*/base-build/builder-effective-config.yaml
          retention-days: 7
          if-no-files-found: ignore
      - name: Generate installer checksums
        run: python desktop/scripts/checksums.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Xueness-${{ matrix.target }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.dmg
            desktop/release/latest*.yml
            desktop/release/*.blockmap
            desktop/release/SHA256SUMS.txt
