name: Desktop installers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, platform: win32, arch: x64, target: windows-x64}
          - {runner: macos-15-intel, platform: darwin, arch: x64, target: macos-x64}
          - {runner: macos-15, platform: darwin, arch: arm64, target: macos-arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      XUENESS_ALLOW_REAL: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      XUENESS_BUILD_PLATFORM: ${{ matrix.platform }}
      XUENESS_BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Install build dependencies
        run: |
          npm ci --prefix webapp --no-audit --no-fund
          npm ci --prefix desktop --no-audit --no-fund
          npm ci --prefix ts --no-audit --no-fund
      - name: Fetch and verify the pinned Electron archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./desktop/node_modules/electron/package.json').version")
          archive="electron-v${version}-${XUENESS_BUILD_PLATFORM}-${XUENESS_BUILD_ARCH}.zip"
          download_dir="$RUNNER_TEMP/xueness-electron"
          gh release download "v$version" --repo electron/electron --pattern "$archive" --dir "$download_dir"
          node - "$download_dir/$archive" "$archive" <<'NODE'
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const [, , file, name] = process.argv;
          const checksums = require('./desktop/node_modules/electron/checksums.json');
          const actual = createHash('sha256').update(readFileSync(file)).digest('hex');
          assert.equal(actual, checksums[name], `Electron checksum mismatch for ${name}`);
          NODE
      - name: Validate application structure and compile UI
        run: |
          npm --prefix ts run check
          npm --prefix webapp run typecheck
          npm --prefix webapp run build
      - name: Build Windows installer and portable ZIP
        if: runner.os == 'Windows'
        run: npm --prefix desktop run dist:win -- --x64 --config.electronDist="$RUNNER_TEMP/xueness-electron"
      - name: Build native Mac disk image and ZIP
        if: runner.os == 'macOS'
        run: npm --prefix desktop run dist:mac -- --${{ matrix.arch }} --config.electronDist="$RUNNER_TEMP/xueness-electron"
      - name: Generate installer checksums
        run: python desktop/scripts/checksums.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Xueness-${{ matrix.target }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.dmg
            desktop/release/latest*.yml
            desktop/release/*.blockmap
            desktop/release/SHA256SUMS.txt
