<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Xueness</title>
  <desc id="desc">A personal agent for your models and workspace. CLI, Web and desktop, with local model controls and plugin-owned features.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#20262f"/><stop offset="1" stop-color="#111418"/></linearGradient>
    <linearGradient id="mark" x2="0" y2="1"><stop stop-color="#3c4a61"/><stop offset="1" stop-color="#1b2430"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#657b99" stop-opacity=".16"/><stop offset="1" stop-color="#657b99" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#surface)"/>
  <ellipse cx="1110" cy="170" rx="360" ry="300" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1279" height="419" rx="24" fill="none" stroke="#b5c4d6" stroke-opacity=".12"/>
  <g transform="translate(76 100)">
    <rect width="112" height="112" rx="27" fill="url(#mark)" stroke="#95a5bd" stroke-opacity=".18"/>
    <svg width="112" height="112" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="6.5" y1="6.5" x2="17.5" y2="17.5" stroke="#ffffff" stroke-width="2.2" />
      <line x1="17.5" y1="6.5" x2="6.5" y2="17.5" stroke="#8b949e" stroke-width="2.2" stroke-dasharray="0.1 3.5" />
      <circle cx="12" cy="12" r="2.4" stroke="#ffffff" stroke-width="1.5" fill="none" />
    </svg>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="220" y="166" fill="#f3f4f5" font-size="64" font-weight="650" letter-spacing="-2">Xueness</text>
    <text x="220" y="209" fill="#a8b1bd" font-size="23">Your models. Your workspace. Your agent.</text>
    <text x="78" y="292" fill="#d9dee6" font-size="22">Built around local models. Every feature belongs to a plugin.</text>
    <g fill="#92a1b5" font-size="15" font-weight="550" letter-spacing="2">
      <text x="78" y="350">CLI / WEB / DESKTOP</text>
      <text x="352" y="350">LOCAL MODEL CONTROLS</text>
      <text x="680" y="350">27 FEATURE PLUGINS</text>
    </g>
  </g>
  <g fill="none" stroke="#7b8da4" stroke-opacity=".24" stroke-width="1.5">
    <path d="M958 103H1020V162H1084M958 162H1020V222H1084"/>
    <rect x="912" y="83" width="46" height="40" rx="9"/>
    <rect x="912" y="142" width="46" height="40" rx="9"/>
    <rect x="1084" y="142" width="46" height="40" rx="9"/>
    <rect x="1084" y="202" width="46" height="40" rx="9"/>
    <circle cx="1020" cy="162" r="5" fill="#8fabc5" stroke="none"/>
  </g>
</svg>
