<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" fill="none">
  <title>Xueness — Space to think. Tools to deliver.</title>
  <desc>A warm paper canvas with the Xueness mark and a task moving from exploration to delivery.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#E7E4DC" stroke-width=".7"/></pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1600" y2="660" gradientUnits="userSpaceOnUse"><stop stop-color="#FBFAF6"/><stop offset="1" stop-color="#F0EEE6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#27241D" flood-opacity=".07"/></filter>
  </defs>
  <rect width="1600" height="660" rx="28" fill="url(#paper)"/>
  <rect x="876" y="0" width="724" height="660" rx="28" fill="url(#grid)"/>
  <path d="M74 72L118 116" stroke="#20221F" stroke-width="7" stroke-linecap="round"/>
  <path d="M118 72L74 116" stroke="#969A8F" stroke-width="7" stroke-dasharray=".1 12" stroke-linecap="round"/>
  <circle cx="96" cy="94" r="9" fill="#FBFAF6" stroke="#20221F" stroke-width="4"/>
  <text x="144" y="108" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="650" letter-spacing="-1.4" fill="#20221F">Xueness</text>
  <text x="76" y="188" font-family="Consolas,monospace" font-size="15" letter-spacing="3.6" fill="#797C72">YOUR AGENT WORKBENCH</text>
  <text x="70" y="298" font-family="Segoe UI,Arial,sans-serif" font-size="86" font-weight="600" letter-spacing="-4" fill="#20221F">Space to think.</text>
  <text x="70" y="396" font-family="Segoe UI,Arial,sans-serif" font-size="86" font-weight="600" letter-spacing="-4" fill="#20221F">Tools to deliver<tspan fill="#E66847">.</tspan></text>
  <text x="76" y="455" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#74776D">One workspace. From the first idea to the final file.</text>
  <rect x="76" y="526" width="110" height="36" rx="18" stroke="#CACDC1"/>
  <rect x="198" y="526" width="84" height="36" rx="18" stroke="#CACDC1"/>
  <rect x="294" y="526" width="118" height="36" rx="18" stroke="#CACDC1"/>
  <g font-family="Consolas,monospace" font-size="13" fill="#595F52" text-anchor="middle"><text x="131" y="549">DESKTOP</text><text x="240" y="549">WEB</text><text x="353" y="549">TERMINAL</text></g>
  <g filter="url(#shadow)">
    <rect x="941" y="132" width="565" height="412" rx="22" fill="#FEFEFB" stroke="#DCDDD4"/>
    <path d="M941 195H1506" stroke="#E6E7DF"/>
    <circle cx="972" cy="164" r="5" fill="#E66847"/><circle cx="992" cy="164" r="5" fill="#E2E4DB"/><circle cx="1012" cy="164" r="5" fill="#E2E4DB"/>
    <text x="1476" y="169" font-family="Consolas,monospace" font-size="12" letter-spacing="1.8" text-anchor="end" fill="#92968A">IDEA → DELIVERY</text>
    <path d="M990 243V452" stroke="#D3D8CA" stroke-width="2"/>
    <g fill="#FEFEFB" stroke="#7B8F72" stroke-width="2"><circle cx="990" cy="247" r="9"/><circle cx="990" cy="314" r="9"/><circle cx="990" cy="381" r="9"/></g>
    <g stroke="#7B8F72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M986 247L989 250L994 244"/><path d="M986 314L989 317L994 311"/><path d="M986 381L989 384L994 378"/></g>
    <circle cx="990" cy="448" r="9" fill="#E66847"/><circle cx="990" cy="448" r="3" fill="#FEFEFB"/>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#33392E"><text x="1021" y="254">Explore the workspace</text><text x="1021" y="321">Shape the plan</text><text x="1021" y="388">Build with real tools</text><text x="1021" y="455">Review what changed</text></g>
    <text x="1021" y="488" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#888E80">Conversation · Context · Skills · Workflows</text>
  </g>
  <text x="1506" y="607" font-family="Consolas,monospace" font-size="12" letter-spacing="2.8" text-anchor="end" fill="#8D9286">BUILT FOR THE LONG RUN</text>
</svg>
